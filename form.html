<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset = "UTF-8">
        <meta property="og:title" content="Contact us at Acme">
        <meta name = "description" content="Article by Alex Carter on the importance of HTML.">
        <meta name = "viewport" content="width=device-width, initial-scale=1">
        <title>Contact us at Acme</title>
    </head>



    <body>

        <header>

            <h1>Acme Support</h1>

            <nav>

                <a href="https://youtu.be/dQw4w9WgXcQ">Home</a>
                <a href="https://youtu.be/dQw4w9WgXcQ">Help</a>
                <a href="https://youtu.be/dQw4w9WgXcQ">Contact</a>

            </nav>

            <hr>

        </header>

        <main>

            <h1>Contact Us</h1>

            <p>Send us a message and we wil get back to you.</p>

            <form action="/signup" method="post">

                <p>
                    <label for="fullname">Full Name</label>
                    <input id="fullname" name="fullname" type="text" required>
                </p>

                <p>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" minlength="5" required>
                </p>

                <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" minlength="10" required></textarea>
                </p>

                <fieldset>
                    <legend>How did you hear about us?</legend>
                    <label><input type="radio" name="exposure" value="search">Search</label>
                    <label><input type="radio" name="exposure" value="friend">Friend</label>
                    <label><input type="radio" name="exposure" value="socials">Social Media</label>
                </fieldset>

                <p>
                    <label>
                    <input type="checkbox" name="newsletter" value="yes">
                    Send me product updates
                    </label>
                </p>

                <p>
                    <button type="submit">Send message</button>
                </p>

            </form>


        </main>

    

        <footer>

            <hr>

            <p>&copy; 2026 Acme Support</p>

        </footer>

    </body>

</html>
